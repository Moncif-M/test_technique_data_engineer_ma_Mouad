[tool.pytest.ini_options]
pythonpath = ["spark"]
testpaths = ["tests"]
markers = ["integration: needs the running Docker stack"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 130
src = ["spark"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
